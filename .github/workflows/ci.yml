# Kedai CI(批次 1,2026-09-13;2026-09-26 远端配置后受控启用)
#
# 背景:仓库此前只有本地门禁(tools/check-all.ps1 + pre-push hook),可被
# `git push --no-verify` / `build.ps1 -SkipChecks` 绕过,且换机后 hook 需重装
# (tools/install-hooks.ps1)。本工作流把同一套门禁搬到服务端强制执行。
#
# 触发:push 到 main + PR + 手动 workflow_dispatch。**平台分支(kedai-Win /
# kedai-Android)刻意不单独触发**——它们与 main 逐字节同源(见
# docs/契约-协议与配置.md「平台分支契约」),为每个分支各跑一遍只是重复烧额度
# (私有仓免费 2000 分钟/月,Windows runner 按 2 倍计费);需要在平台分支上验证时
# 用网页的 Run workflow 手动触发。环境:windows-latest(需 MSVC;check-all.ps1 内已内置
# vcvars64 定位逻辑,runner 自带 VS 即可)。
#
# 远端:2026-09-26 起 origin 指向 GitHub 私有仓;本地等价命令:
# `powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-all.ps1`
# (只跑快速档加 `-Quick`;跳过后端加 `-SkipRust`)。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同 ref 的过期 run 直接取消:本仓库存在**多会话并行推送**的场景,没有这一条会出现
# 三次 run 并行、其中两次白烧额度(Windows runner 计费 ×2;2026-09-26 实测:
# run 36258299410 与 36259877695 并行,前者在后者启动后仍跑了 25 分钟)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 工具链**锁到与本地一致的版本**,不用 `stable`。原因(2026-09-26 首跑实测):
      # `@stable` 当时已是 1.98.1,其 clippy 新增 `chunks_exact_to_as_chunks`,本地 1.97.1
      # 不报——`-D warnings` 下 CI 直接变红(`server-rs/src/services/memory_service.rs:109`)。
      # 本工作流的自我定位是「把同一套门禁搬到服务端」,门禁就得与本地**可复现地同版本**,
      # 否则上游每次发版都可能凭空变红。
      #
      # **版本号的真值源是仓库根 `rust-toolchain.toml`,不是这一行**(2026-09-27 起)。
      # 本 action **不支持**读 toolchain 文件(维护者明确拒绝,见 `docs/经验.md` E63),
      # 所以这里的 `@1.97.1` 是**必须手写同步的第二处**;三处(本行 / toml / MAINTENANCE.md
      # 的工具链行)由 `tools/check-doc-claims.mjs` 逐条比对——漏改任意一处,本地门禁即红。
      # 升版:先改 `rust-toolchain.toml` 的 channel,再按该文件的「升版流程」五步走。
      - name: Setup Rust (锁 1.97.1,真值源 rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server-rs/target
            src-tauri/target
          key: cargo-${{ hashFiles('server-rs/Cargo.lock', 'src-tauri/Cargo.lock') }}

      - name: Install cargo-audit
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-audit -ErrorAction SilentlyContinue)) {
            cargo install cargo-audit --locked
          }

      - name: Install npm deps (lockfile 严格一致)
        run: npm ci

      # 前端产物必须先于 Rust 阶段存在。`server-rs/src/api/static_files.rs:202` 的
      # `include_dir!("$CARGO_MANIFEST_DIR/../web/dist")` 是**编译期内嵌**,目录不存在
      # 即 `proc macro panicked` 并编译失败——2026-09-26 首次真跑就撞上(cargo clippy
      # exit=101,fmt 通过、后续阶段全部跳过)。`web/dist` 被 `.gitignore` 忽略
      # (`.gitignore:3`),故**全新 clone 上必须显式构建一次**;本地看不出来是因为
      # build.ps1 总是先构建前端。
      # 代价:check-all.ps1 的 `web: vite build` 阶段随后还会再构建一次(该阶段只在
      # `-Quick` 下跳过),属可接受的少量重复,换来 Rust 阶段可编译。
      - name: Build web (Rust 阶段的 include_dir! 依赖它存在)
        run: npm run build -w web

      # 审计口径与本地一致(批次 6.1):check-all.ps1 的独立「审计段」同时扫描
      # server-rs/Cargo.lock 与 src-tauri/Cargo.lock 两把锁(cargo audit 硬门禁),
      # 并执行 npm audit --omit=dev 生产依赖硬门禁。无法本地修复的 unmaintained 告警
      # 由仓库根 .cargo/audit.toml 逐条 ignore(随 checkout 带入,无需额外步骤)。
      - name: Local gates (fmt / clippy / test / audit[两锁+npm] / contract / arch / lock-sync / typecheck / vitest / build)
        shell: pwsh
        run: ./tools/check-all.ps1
